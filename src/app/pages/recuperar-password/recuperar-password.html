<main class="position-relative overflow-hidden min-vh-100 d-flex align-items-center py-4 bg-primary">
  <div class="container position-relative z-1">
    <div class="row justify-content-center"><div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
      <section class="card border-0 rounded-5 shadow"><div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4"><img src="img/logo_morado.png" alt="Logotipo AsisTec" width="100" height="100"><h1 class="fs-4 fw-bold text-primary mt-2">Recuperar contraseña</h1></div>
        @if (error()) { <div class="alert alert-danger" role="alert">{{ error() }}</div> }
        @if (aviso()) { <div class="alert alert-success" role="status">{{ aviso() }}</div> }
        <form (ngSubmit)="solicitar()" class="d-flex flex-column gap-3">
          <div><label for="correo" class="form-label fw-semibold">Correo electrónico</label><input id="correo" name="correo" type="email" class="form-control border-primary py-3" [(ngModel)]="correo" required></div>
          <button [type]="solicitado ? 'button' : 'submit'" (click)="solicitado && reenviar()" class="btn btn-primary py-3 fw-semibold" [disabled]="cargando()">{{ solicitado ? 'Reenviar código de recuperación' : 'Enviar código' }}</button>
        </form>
        @if (solicitado) {
          <form (ngSubmit)="guardarPassword()" class="d-flex flex-column gap-3 mt-4">
          <div><label for="token" class="form-label fw-semibold">Código OTP</label><input id="token" name="token" type="text" inputmode="numeric" pattern="[0-9]{4,10}" maxlength="10" class="form-control border-primary py-3" [(ngModel)]="token" autocomplete="one-time-code" required></div>
            <div><label for="password" class="form-label fw-semibold">Nueva contraseña</label><input id="password" name="password" type="password" minlength="8" class="form-control border-primary py-3" [(ngModel)]="nuevaPassword" required></div>
            <button class="btn btn-outline-primary py-3 fw-semibold" [disabled]="cargando()">Actualizar contraseña</button>
          </form>
        }
        <a routerLink="/login" class="d-block text-center mt-4 link-primary fw-bold">Volver al inicio de sesión</a>
      </div></section>
    </div></div>
  </div>
</main>
