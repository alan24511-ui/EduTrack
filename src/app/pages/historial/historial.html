<app-layout>
    <div class="p-4 p-lg-5 text-primary">

        <!-- Encabezado -->
        <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-start gap-3 mb-4">
            <div>
                <h2 class="fs-2 fw-bolder mb-1">Historial</h2>
                <p class="fs-6 opacity-75 mb-0">Historial del menú lateral</p>
            </div>
            <div class="d-flex align-items-center justify-content-between justify-content-md-end gap-4">
                <button type="button" class="btn btn-primary rounded-3 d-flex align-items-center gap-2">
                    <img src="img/v51_39.png" alt="" width="18" height="18">
                    <span>Exportar reporte</span>
                </button>
                <div class="d-flex align-items-center gap-3">
                    <img src="img/v38_80.png" alt="Notificaciones" width="22" height="22">
                    <span class="d-inline-block rounded-circle text-bg-primary fw-bold p-2">US</span>
                </div>
            </div>
        </header>

        <!-- Filtros -->
        <section class="row g-3 align-items-end mb-4 mb-lg-5">
            <div class="col-12 col-sm-6 col-xl">
                <label for="filtro-fecha-inicial" class="form-label fw-medium mb-1">Fecha inicial</label>
                <input type="date" id="filtro-fecha-inicial" class="form-control border-primary rounded-3 py-2">
            </div>
            <div class="col-12 col-sm-6 col-xl">
                <label for="filtro-fecha-final" class="form-label fw-medium mb-1">Fecha final</label>
                <input type="date" id="filtro-fecha-final" class="form-control border-primary rounded-3 py-2">
            </div>
            <div class="col-12 col-sm-6 col-xl">
                <label for="filtro-grupo" class="form-label fw-medium mb-1">Grupo</label>
                <select id="filtro-grupo" class="form-select border-primary rounded-3 py-2">
                    <option>Todos</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-xl">
                <label for="filtro-estado" class="form-label fw-medium mb-1">Estado</label>
                <select id="filtro-estado" class="form-select border-primary rounded-3 py-2">
                    <option>Todos</option>
                </select>
            </div>
            <div class="col-12 col-xl-auto">
                <button type="button" class="btn btn-primary rounded-3 px-5 py-2 w-100">Filtrar</button>
            </div>
        </section>

        <!-- Tabla de historial -->
        <section class="bg-white rounded-4 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle text-nowrap mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="text-primary fw-bolder px-4 py-3">Fecha inicial</th>
                            <th class="text-primary fw-bolder px-4 py-3">No. de control</th>
                            <th class="text-primary fw-bolder px-4 py-3">Alumno</th>
                            <th class="text-primary fw-bolder px-4 py-3">Hora de entrada</th>
                            <th class="text-primary fw-bolder px-4 py-3">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-historial"></tbody>
                </table>
            </div>
        </section>

    </div>
</app-layout>
