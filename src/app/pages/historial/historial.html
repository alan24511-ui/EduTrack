<app-layout>
    <div class="p-4 p-lg-5 text-primary">

        <!-- Encabezado -->
        <header class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4">
            <div>
                <h2 class="fs-2 fw-bolder mb-1">Historial de Asistencia</h2>
                <p class="fs-5 fw-medium mb-0">Consulta los registros de entrada de los alumnos</p>
            </div>
            <!-- Campana y usuario: solo en móvil, como en el diseño original -->
            <div class="d-flex d-sm-none align-items-center gap-2 align-self-end">
                <button type="button" class="btn border-0 p-1" aria-label="Notificaciones">
                    <img src="img/v38_80.png" alt="" width="24" height="24">
                </button>
                <span class="d-inline-block rounded-circle text-bg-primary fw-bold p-2">US</span>
            </div>
        </header>

        <!-- Registros de asistencia -->
        <section class="card rounded-4 overflow-hidden shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle text-nowrap mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="text-primary fw-bolder px-4 py-3">Fecha</th>
                            <th class="text-primary fw-bolder px-4 py-3">No. de control</th>
                            <th class="text-primary fw-bolder px-4 py-3">Nombre</th>
                            <th class="text-primary fw-bolder px-4 py-3">Grupo</th>
                            <th class="text-primary fw-bolder px-4 py-3">Hora</th>
                            <th class="text-primary fw-bolder px-4 py-3">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-historial"></tbody>
                </table>
            </div>
        </section>

    </div>
</app-layout>
